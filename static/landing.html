<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #F0A500;
      --long:   #22C55E;
      --text:   #F0F2F7;
      --muted:  rgba(240,242,247,0.45);
      --border: rgba(255,255,255,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── WebGL canvas ── */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }

    /* ── Depth overlays ── */
    #vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 50%, transparent 25%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, transparent 30%, transparent 65%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── App layer ── */
    #app {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    #nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 48px);
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 10px 20px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .nav-brand {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none;
    }

    .brand-dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent), 0 0 18px rgba(240,165,0,0.4);
      animation: brand-pulse 2.4s ease-in-out infinite;
    }

    @keyframes brand-pulse {
      0%, 100% { box-shadow: 0 0 8px var(--accent), 0 0 18px rgba(240,165,0,0.4); }
      50%       { box-shadow: 0 0 4px rgba(240,165,0,0.5); }
    }

    .nav-name {
      font-family: 'Outfit', sans-serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .nav-signin {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      background: var(--accent);
      border: none; border-radius: 4px;
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.01em;
      text-decoration: none; cursor: pointer;
      transition: opacity 150ms ease;
    }
    .nav-signin:hover  { opacity: 0.85; }
    .nav-signin:active { opacity: 0.7; }
    .nav-signin svg { width: 12px; height: 12px; }

    /* ── HERO ── */
    #hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 80px;
      text-align: center;
    }

    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Live badge */
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 14px 5px 10px;
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 999px;
      background: rgba(34,197,94,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 36px;
    }

    .live-indicator {
      position: relative;
      width: 9px; height: 9px;
      display: flex; align-items: center; justify-content: center;
    }

    .live-ping {
      position: absolute;
      inset: 0;
      background: var(--long);
      border-radius: 50%;
      animation: live-ping 1.8s ease-in-out infinite;
    }

    @keyframes live-ping {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .live-dot {
      position: relative;
      width: 6px; height: 6px;
      background: var(--long);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--long);
    }

    .live-text {
      font-family: 'Outfit', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--long);
    }

    /* Hero headline — Orbitron for web3 identity */
    .hero-h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 10.5vw, 116px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 0.88;
      margin-bottom: 28px;
    }

    .hero-h1 .word-signal {
      display: block;
      color: #fff;
      text-shadow:
        0 0 40px rgba(240,165,0,0.18),
        0 0 80px rgba(240,165,0,0.07);
    }

    .hero-h1 .word-engine {
      display: block;
      color: var(--accent);
      text-shadow:
        0 0 20px rgba(240,165,0,0.55),
        0 0 55px rgba(240,165,0,0.28),
        0 0 100px rgba(240,165,0,0.10);
    }

    /* Tagline */
    .hero-tagline {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
      max-width: 460px;
      margin-bottom: 44px;
    }

    /* ── Liquid Glass CTA ── */
    .liquid-btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 9px;
      padding: 15px 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none; cursor: pointer;
      overflow: hidden;
      margin-bottom: 48px;
      /* Liquid glass depth shadows */
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        inset  3px  3px 0.5px -3.5px rgba(255,255,255,0.08),
        inset -3px -3px 0.5px -3.5px rgba(255,255,255,0.80),
        inset  1px  1px  1px -0.5px rgba(255,255,255,0.45),
        inset -1px -1px  1px -0.5px rgba(255,255,255,0.45),
        inset  0    0   6px   6px   rgba(255,255,255,0.09),
        inset  0    0   2px   2px   rgba(255,255,255,0.04),
        0 0 28px rgba(240,165,0,0.18),
        0 10px 40px rgba(0,0,0,0.45);
      transition: box-shadow 280ms ease, transform 280ms ease;
    }

    /* Glass backdrop layer */
    .liquid-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      z-index: 0;
    }

    /* Subtle inner gradient */
    .liquid-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, transparent 50%);
      z-index: 1;
      pointer-events: none;
    }

    .liquid-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        inset  3px  3px 0.5px -3.5px rgba(255,255,255,0.12),
        inset -3px -3px 0.5px -3.5px rgba(255,255,255,0.90),
        inset  1px  1px  1px -0.5px rgba(255,255,255,0.55),
        inset -1px -1px  1px -0.5px rgba(255,255,255,0.55),
        inset  0    0   6px   6px   rgba(255,255,255,0.13),
        inset  0    0   2px   2px   rgba(255,255,255,0.06),
        0 0 40px rgba(240,165,0,0.30),
        0 14px 50px rgba(0,0,0,0.55);
    }

    .liquid-btn:active { transform: translateY(0); }

    .btn-content {
      position: relative;
      z-index: 2;
      display: flex; align-items: center; gap: 9px;
    }

    .btn-content svg { width: 14px; height: 14px; }

    /* ── Stats bar ── */
    .hero-stats {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 26px;
      gap: 3px;
    }

    .stat-item + .stat-item {
      border-left: 1px solid var(--border);
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px; font-weight: 500;
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .stat-label {
      font-family: 'Outfit', sans-serif;
      font-size: 9px; font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(240,242,247,0.3);
    }

    /* ── Footer ── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .footer-brand {
      display: flex; align-items: center; gap: 7px;
    }

    .footer-dot {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.7;
    }

    .footer-name {
      font-family: 'Outfit', sans-serif;
      font-size: 12px; font-weight: 500;
      color: rgba(240,242,247,0.35);
    }

    .footer-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: rgba(240,242,247,0.18);
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #nav { width: calc(100% - 32px); }
      .hero-stats { display: none; }
      .hero-h1 { letter-spacing: 0.06em; }
      .liquid-btn { padding: 14px 36px; font-size: 15px; }
      #footer { padding: 12px 20px; }
      .footer-tag { display: none; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .brand-dot  { animation: none; }
      .live-ping  { animation: none; }
      .liquid-btn { transition: none; }
      .nav-signin { transition: none; }
    }
  </style>
</head>
<body>

<!-- WebGL canvas — full-screen animated shader background -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<!-- Depth vignette -->
<div id="vignette" aria-hidden="true"></div>

<!-- ═══ NAV ═══ -->
<nav id="nav" aria-label="Main navigation">
  <a href="/landing" class="nav-brand" aria-label="Signal Engine home">
    <div class="brand-dot"></div>
    <span class="nav-name">Signal Engine</span>
  </a>
  <a href="/login" class="nav-signin">
    Sign In
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M2 8a.75.75 0 0 1 .75-.75h8.69L8.22 4.03a.75.75 0 0 1 1.06-1.06l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06l3.22-3.22H2.75A.75.75 0 0 1 2 8Z" clip-rule="evenodd"/>
    </svg>
  </a>
</nav>

<!-- ═══ HERO ═══ -->
<main id="app">
  <section id="hero">
    <div class="hero-inner">

      <!-- Live status badge -->
      <div class="live-badge" role="status" aria-label="Engine is running">
        <div class="live-indicator" aria-hidden="true">
          <span class="live-ping"></span>
          <span class="live-dot"></span>
        </div>
        <span class="live-text">Engine Live</span>
      </div>

      <!-- Main headline -->
      <h1 class="hero-h1">
        <span class="word-signal">SIGNAL</span>
        <span class="word-engine">ENGINE</span>
      </h1>

      <!-- Tagline -->
      <p class="hero-tagline">
        Algorithmic futures signals across MEXC, Binance &amp; OKX.<br>
        Six regime-aware strategies, slippage-calibrated sizing.
      </p>

      <!-- Liquid glass CTA -->
      <a href="/login" class="liquid-btn" aria-label="Sign in to enter the dashboard">
        <span class="btn-content">
          Enter Dashboard
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2 8a.75.75 0 0 1 .75-.75h8.69L8.22 4.03a.75.75 0 0 1 1.06-1.06l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06l3.22-3.22H2.75A.75.75 0 0 1 2 8Z" clip-rule="evenodd"/>
          </svg>
        </span>
      </a>

      <!-- Stats bar -->
      <div class="hero-stats" role="list" aria-label="Engine statistics">
        <div class="stat-item" role="listitem">
          <span class="stat-val">6</span>
          <span class="stat-label">Strategies</span>
        </div>
        <div class="stat-item" role="listitem">
          <span class="stat-val">3</span>
          <span class="stat-label">Exchanges</span>
        </div>
        <div class="stat-item" role="listitem">
          <span class="stat-val">24/7</span>
          <span class="stat-label">Runtime</span>
        </div>
        <div class="stat-item" role="listitem">
          <span class="stat-val">0.02%</span>
          <span class="stat-label">Taker Fee</span>
        </div>
      </div>

    </div>
  </section>
</main>

<!-- ═══ FOOTER ═══ -->
<footer id="footer">
  <div class="footer-brand">
    <div class="footer-dot"></div>
    <span class="footer-name">Signal Engine</span>
  </div>
  <span class="footer-tag">Private · Authorized Access Only</span>
</footer>

<script>
// ── WebGL Shader Background ──
// Vanilla JS port of the WebGLShader React component.
// No THREE.js — raw WebGL only, zero external dependencies.
(function () {
  'use strict';

  var canvas = document.getElementById('bg-canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  var VERT = [
    'attribute vec3 position;',
    'void main() { gl_Position = vec4(position, 1.0); }'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'uniform vec2  resolution;',
    'uniform float time;',
    'uniform float xScale;',
    'uniform float yScale;',
    'uniform float distortion;',
    'void main() {',
    '  vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);',
    '  float d = length(p) * distortion;',
    '  float rx = p.x * (1.0 + d);',
    '  float gx = p.x;',
    '  float bx = p.x * (1.0 - d);',
    '  float r = 0.05 / abs(p.y + sin((rx + time) * xScale) * yScale);',
    '  float g = 0.05 / abs(p.y + sin((gx + time) * xScale) * yScale);',
    '  float b = 0.05 / abs(p.y + sin((bx + time) * xScale) * yScale);',
    '  gl_FragColor = vec4(r, g, b, 1.0);',
    '}'
  ].join('\n');

  function mkShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s); return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);

  var quad = new Float32Array([
    -1,-1,0,  1,-1,0, -1,1,0,
     1,-1,0, -1, 1,0,  1,1,0
  ]);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  var posLoc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

  var uRes  = gl.getUniformLocation(prog, 'resolution');
  var uTime = gl.getUniformLocation(prog, 'time');
  var uXS   = gl.getUniformLocation(prog, 'xScale');
  var uYS   = gl.getUniformLocation(prog, 'yScale');
  var uDist = gl.getUniformLocation(prog, 'distortion');

  gl.uniform1f(uXS,  1.0);
  gl.uniform1f(uYS,  0.5);
  gl.uniform1f(uDist, 0.05);

  var t = 0, rafId;
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }

  function draw() {
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  function tick() {
    t += 0.007;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);

  if (prefersReduced) {
    t = 2.5; draw();
  } else {
    tick();
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        tick();
      }
    });
  }
})();
</script>
</body>
</html>
