<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Outfit:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0A0B0D;
      --surface:     #111318;
      --surface-up:  #1A1D26;
      --border:      #1F2330;
      --text:        #F0F2F7;
      --muted:       #6B7280;
      --accent:      #F0A500;
      --short:       #EF4444;
      --radius-sm:   2px;
      --radius:      4px;
      --font-display:'Instrument Sans', sans-serif;
      --font-ui:     'Outfit', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
      padding-left: 15px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 9px 11px;
      background: var(--surface-up);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 100ms ease-in-out;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: 13px;
      opacity: 0.6;
    }

    .field + .field { margin-top: 14px; }

    .error-msg {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--short);
      margin-top: 7px;
    }

    .error-msg.visible { display: flex; }

    .error-icon {
      font-size: 10px;
      flex-shrink: 0;
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0A0B0D;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 100ms ease-in-out;
      letter-spacing: 0.01em;
    }

    .btn:hover  { opacity: 0.88; }
    .btn:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">Signal Engine</span>
    </div>
    <div class="subtitle">Private dashboard</div>
    <div class="divider"></div>

    <form method="POST" action="/login" id="login-form">
      <input type="hidden" name="next" id="next-input" value="/">
      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          autocomplete="username"
          autofocus
          spellcheck="false"
          autocapitalize="none"
        >
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >
      </div>
      <div class="error-msg" id="error-msg">
        <span class="error-icon">✕</span>
        <span>Invalid credentials</span>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('error') === '1') {
      document.getElementById('error-msg').classList.add('visible');
    }
    const next = p.get('next');
    if (next && next.startsWith('/')) {
      document.getElementById('next-input').value = next;
    }
  </script>
</body>
</html>
