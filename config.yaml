exchanges:
  mexc:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
      - UKOIL/USDT:USDT
      - XAUT/USDT:USDT
  binance:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
  okx:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
  hyperliquid:
    enabled: true
    pairs:
      - BTC/USDC:USDC
      - ETH/USDC:USDC
      - SOL/USDC:USDC

shadow_mode: false             # true = log only, false = live alerts

timeframe: "15m"
candle_limit: 100

regime_timeframe: "1h"
regime_limit: 100

regime:
  adx_trend_threshold: 25        # ADX above this = trending
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  ema_slope_threshold: 0.001     # minimum % slope to be "trending"
  bb_period: 20
  bb_std: 2.0
  high_vol_bb_multiplier: 1.5    # bb_width > avg * this = high-volatility
  stability_candles: 5           # candles to fetch for stability check
  stability_min_match: 3         # how many must agree for label to be stable

signals:
  volume_spike_multiplier: 1.5   # vol_breakout gate: volume > avg * this = spike confirmed
  volume_spike_signal_multiplier: 2.0  # volume_spike strategy: stricter — institutional participation threshold
  volume_avg_period: 20
  rsi_period: 14
  rsi_divergence_lookback: 10    # candles to look back for divergence
  rsi_oversold: 45               # RSI must be below this for bullish rsi_divergence
  rsi_overbought: 62             # RSI must be above this for bearish rsi_divergence (raised from 55 — choppy SHORT WR was 14%)
  rsi_divergence_min_diff: 5     # minimum RSI point gap between current and prior extreme (raised from 3 — stronger divergence required)
  ema_signal_fast: 9             # ema_9_21_crossover fast period
  ema_signal_slow: 21            # ema_9_21_crossover slow period
  rsi_extreme_oversold: 35       # rsi_extreme long trigger: RSI exits below this
  rsi_extreme_overbought: 65     # rsi_extreme short trigger: RSI exits above this
  atr_period: 14
  atr_stop_multiplier: 1.5
  atr_stop_multiplier_choppy: 2.0      # wider stop for mean-reversion plays
  atr_stop_multiplier_high_vol: 2.5    # wider stop in high-volatility regime
  trending_max_confidence: 0.65        # skip trending signals above this — high confidence = extended move, late entry
  rr_ratio: 2.0                        # default take-profit = entry + risk * rr_ratio
  rr_ratio_choppy: 1.5                 # mean-reversion plays: closer TP, price oscillates shorter
  rr_ratio_trending: 2.5              # trend-following: sustained moves justify wider target
  rr_ratio_high_vol: 2.0              # volatile but uncertain direction: keep at default
  sd_impulse_atr_mult: 2.0             # supply/demand: impulse candle body must exceed N × ATR

deduplication:
  window_candles: 3              # suppress same pair+dir+strategy+regime within N candles

walk_forward:
  outcome_window_hours: 8        # how long after fire to check outcome
  promotion_gate_total: 38       # minimum total shadow signals for promotion
  promotion_gate_per_regime: 15  # minimum per regime label
  promotion_accuracy: 0.55       # minimum directional accuracy (55% = profitable at 1.5:1 R:R)

llm:
  commentary_model: "claude-haiku-4-5-20251001"
  analysis_model: "claude-sonnet-4-6"
  max_tokens: 256
  cache_ttl_seconds: 300

dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false

copy_trader:
  enabled: true
  top_n: 5
  initial_balance: 10000        # starting capital in USDT
  position_size_pct: 0.05       # allocate 5% of current balance per copied position ($500 at start)
  stop_loss_pct: 0.20           # auto-close copy position if it loses >20% of margin
  max_concurrent_positions: 15  # hard cap across all tracked traders
  min_pnl_30d: 100000           # only follow traders with >$100K 30d PnL
  poll_interval_minutes: 2      # how often to check HL positions (was 15 — top traders open/close in minutes)

polymarket_trader:
  enabled: true
  top_n: 10                    # wider than HL (5) because PM traders specialise by category
  initial_balance: 10000
  position_size_pct: 0.05
  max_concurrent_positions: 20
  min_pnl_30d: 50000
  volume_floor: 10000          # filter single-market outliers
  # Polymarket has no public leaderboard API — add top trader wallet addresses here.
  # Find them at polymarket.com/leaderboard. The service will track their positions.
  watched_wallets: []
