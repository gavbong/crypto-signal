indices:
  enabled: true
  pairs:
    - DJ30/USD
    - FTSE100/USD
    - DAX/USD
    - XAU/USD
  session_hours:
    # Format: HH:MM-HH:MM (zero-padded 24h clock) IANA-timezone
    DJ30/USD:    "09:30-16:00 America/New_York"
    FTSE100/USD: "08:00-16:30 Europe/London"
    DAX/USD:     "09:00-17:30 Europe/Berlin"
    XAU/USD:     "00:01-23:59 UTC"      # gold: 24h on weekdays, weekends blocked by _is_market_open

exchanges:
  mexc:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
      - XAUT/USDT:USDT
  binance:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
  okx:
    enabled: true
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
  hyperliquid:
    enabled: false              # excluded — high slippage + USDC funding costs vs USDT pairs
    pairs:
      - BTC/USDC:USDC
      - ETH/USDC:USDC
      - SOL/USDC:USDC

shadow_mode: false             # true = log only, false = live alerts

correlation_window_hours: 4    # ±hours window to match a copy position open with an algo signal

timeframe: "15m"
candle_limit: 100

regime_timeframe: "1h"
regime_limit: 100

regime:
  adx_trend_threshold: 25        # ADX above this = trending
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  ema_slope_threshold: 0.001     # minimum % slope to be "trending"
  bb_period: 20
  bb_std: 2.0
  high_vol_bb_multiplier: 1.5    # bb_width > avg * this = high-volatility
  stability_candles: 5           # candles to fetch for stability check
  stability_min_match: 3         # how many must agree for label to be stable
  # Flickering detection — too many regime transitions = unstable, skip signals
  flicker_window: 20             # how many recent candles to inspect
  flicker_max_transitions: 4     # more than this many label changes = flickering

# ── HMM macro regime classifier ────────────────────────────────────────────────
# Trains a Gaussian HMM on daily BTC-USD data to detect the macro market cycle.
# Output (crash/bear/neutral/bull/euphoria) scales paper-trader position sizes.
# Risk multipliers per macro label (applied on top of per-regime risk_pct):
#   crash=0% halt | bear=30% | neutral=70% | bull=100% | euphoria=80%
# Retrains automatically every 24h at 06:30 UTC. Cache: data/macro/hmm_model_cache.json
macro_hmm:
  enabled: true
  ticker: "BTC-USD"              # yfinance ticker used for training
  train_days: 504                # ~2 years of daily data
  n_states_min: 3
  n_states_max: 5
  retrain_interval_hours: 24
  stability_bars: 3              # macro regime must hold N days before acting
  # Override default risk multipliers here if needed:
  # risk_multipliers:
  #   crash: 0.0
  #   bear: 0.3
  #   neutral: 0.7
  #   bull: 1.0
  #   euphoria: 0.8

signals:
  volume_spike_multiplier: 1.5   # vol_breakout gate: volume > avg * this = spike confirmed
  volume_spike_signal_multiplier: 2.0  # volume_spike strategy: stricter — institutional participation threshold
  volume_avg_period: 20
  rsi_period: 14
  rsi_divergence_lookback: 10    # candles to look back for divergence
  rsi_oversold: 45               # RSI must be below this for bullish rsi_divergence
  rsi_overbought: 62             # RSI must be above this for bearish rsi_divergence (raised from 55 — choppy SHORT WR was 14%)
  rsi_divergence_min_diff: 5     # minimum RSI point gap between current and prior extreme (raised from 3 — stronger divergence required)
  ema_signal_fast: 9             # ema_9_21_crossover fast period
  ema_signal_slow: 21            # ema_9_21_crossover slow period
  rsi_extreme_oversold: 35       # rsi_extreme long trigger: RSI exits below this
  rsi_extreme_overbought: 65     # rsi_extreme short trigger: RSI exits above this
  atr_period: 14
  atr_stop_multiplier: 1.5
  atr_stop_multiplier_choppy: 2.0      # wider stop for mean-reversion plays
  atr_stop_multiplier_high_vol: 2.5    # wider stop in high-volatility regime
  trending_max_confidence: 0.65        # skip trending signals above this — high confidence = extended move, late entry
  rr_ratio: 2.0                        # default take-profit = entry + risk * rr_ratio
  rr_ratio_choppy: 1.5                 # mean-reversion plays: closer TP, price oscillates shorter
  rr_ratio_trending: 2.5              # trend-following: sustained moves justify wider target
  rr_ratio_high_vol: 2.0              # volatile but uncertain direction: keep at default

  # ── Per-asset-class RR override ──────────────────────────────────────────────
  # Calibrated 2026-05-25 from 60-day index backtest (239 signals, run #14):
  #   Only 5-12% of index trades reach 1.0R within the 8-candle window.
  #   Winning trades average 0.6-1.0R at exit — 2.0R TP is unreachable in practice.
  #   At rr_ratio_index=1.2, TP is achievable ~25-30% of the time, and the
  #   break-even WR (45%) is met by the working combos (FTSE choppy 56%, XAU trending 57%).
  #   Priority: strategy-level override > asset-class > regime > global.
  rr_ratio_index: 1.2                  # indices + gold CFDs: slower instruments, TP at 2R rarely hit

  # Per-strategy RR overrides — applied on top of the per-regime values above.
  # Use when a strategy's real stop-out cost (gap slippage, fee drag) is atypically high
  # and the regime-level ratio doesn't compensate adequately.
  # Calibrated 2026-05-18 from 15 live closed trades (slippage_calibration.py):
  #   liquidity_grab SL exit gap slippage: mean 1.41%, median 1.22% (vs 0.05% assumed)
  #   vol_breakout SL exit gap slippage:   mean 0.20%, median 0.11% (close to assumed)
  rr_ratio_strategy:
    liquidity_grab: 2.5               # higher TP needed: failed sweeps gap hard through SL
    vol_breakout: 2.0                 # clean stop-outs, no adjustment needed
    rsi_divergence: 2.0               # medium gap risk in choppy markets
    rsi_extreme: 2.0
    ema_9_21_crossover: 2.0
    session_open_breakout: 1.5         # ORB: range-based SL tends to be wider than ATR; lower RR to keep TP reachable
    # supply_demand: not set — uses asset-class RR (1.2 for indices, regime RR for crypto)

  # Per-regime-per-strategy overrides — highest precision, applied after strategy-level.
  # Use when a strategy's optimal RR differs by regime (e.g. mean-reversion vs trend-following).
  rr_ratio_regime_overrides:
    choppy:
      liquidity_grab: 1.5  # mean-reversion in chop: 2.5R TP never hit; 1.5R reachable (live avg_R +0.077 → target +0.15)

  # ── Strategy skip list per pair ───────────────────────────────────────────────
  # 60-day backtest (run #14): DAX uniformly underperforms across all strategies.
  #   supply_demand DAX: 0% WR (3 signals)
  #   liquidity_grab DAX: 20% WR (10 signals), -2.54R
  # Skip these until DAX accumulates enough live signals for re-evaluation.
  skip_strategies_for_pairs:
    DAX/USD:
      - supply_demand
      - liquidity_grab
    DJ30/USD:
      - supply_demand  # choppy regime: 34 signals, 38.2% WR, -7.36R (backtest run #15); without it DJ30 is +5.24R @ 54.2% WR
    # rsi_extreme/choppy: ETH A-grade (p=0.005 n=79 WR=59.5%), BTC/SOL D-grade (p=0.435/0.310).
    # Skip BTC/SOL in choppy only — other regimes (high-vol) remain active for both pairs.
    BTC/USDT:USDT:
      choppy:
        - rsi_extreme
    SOL/USDT:USDT:
      choppy:
        - rsi_extreme

  # ── Slippage-adjusted TP ─────────────────────────────────────────────────────
  # When true: TP is extended so effective RR (after entry + SL exit fill costs)
  # equals the target RR. Without this, slippage eats into wins while losses are
  # larger than intended — net EV is lower than the RR target implies.
  slip_adjust_tp: true

  sd_impulse_atr_mult: 2.0             # supply/demand: impulse candle body must exceed N × ATR
  sd_bos_lookback: 10                  # supply/demand: BoS filter — impulse must break N prior bars' high (demand) or low (supply)
  lq_session_window_hours: 4           # liquidity_grab: for index pairs, only fire within N hours of session open (London→NY reversal window)
  orb_volume_multiplier: 1.5           # session_open_breakout: current candle volume must exceed N× rolling avg to confirm breakout

signal_quality:
  min_quality_score: 40          # lowered 2026-05-26 to allow index pairs to bootstrap — max score at bootstrap_wr is 48 so 60 was unreachable for new combos
  quality_weights:
    regime_confidence: 0.20
    rolling_30d_wr: 0.80
    stop_quality: 0.00           # zeroed — 15m crypto stops (0.3-0.8%) cluster near the min of the 0.3-3% range,
                                 # giving near-zero scores and blocking valid signals. Hard gate (is_stop_in_range)
                                 # already handles truly bad stops.
  bootstrap_wr: 0.35             # WR assumed when <20 live signals exist for a combo; lowered 2026-05-22 (was 0.45 — near fee-adj BE, new combos fired too freely)

strategy_health:
  auto_disable_window_days: 30   # rolling window for WR calculation
  auto_disable_min_signals: 20   # don't disable on fewer signals than this
  watch_threshold: 0.38          # WR below this → WATCH
  caution_threshold: 0.33        # WR below this → CAUTION
  disable_threshold: 0.30        # WR below this → DISABLED (approx breakeven for RR=2.33)
  re_enable_threshold: 0.40      # auto re-enable if WR recovers above this for 14d
  re_enable_min_days: 14

regime_gates:
  min_regime_age_candles:
    trending-up: 3
    trending-down: 3
    choppy: 5
    high-volatility: 2
  max_regime_age_candles:
    trending-up: 8      # 8 × 15m = 2h; trend exhausted if regime older than this (live: EMA longs 25% WR in stale trending-up)

stop_quality:
  min_stop_pct: 0.003            # global floor — overridden per asset class
  max_stop_pct: 0.030            # global ceiling

asset_class_profiles:
  crypto:
    pairs:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - SOL/USDT:USDT
    adx_trend_threshold: 25
    ema_slope_threshold: 0.001
    high_vol_bb_multiplier: 1.5
    stop_min_pct: 0.003
    stop_max_pct: 0.030
  gold:
    pairs:
      - XAUT/USDT:USDT
    adx_trend_threshold: 20
    ema_slope_threshold: 0.001
    high_vol_bb_multiplier: 1.4
    stop_min_pct: 0.002          # gold can move 0.1-0.3% in 15m; keep floor low
    stop_max_pct: 0.025
  indices:
    pairs:
      - DJ30/USD
      - FTSE100/USD
      - DAX/USD
    adx_trend_threshold: 18      # indices trend more slowly than crypto
    ema_slope_threshold: 0.0005  # lower slope threshold for low-vol instruments
    high_vol_bb_multiplier: 1.3
    stop_min_pct: 0.001          # 0.1% floor — indices less volatile than crypto
    stop_max_pct: 0.015
  indices_gold:
    pairs:
      - XAU/USD
    adx_trend_threshold: 18
    ema_slope_threshold: 0.0005
    high_vol_bb_multiplier: 1.3
    stop_min_pct: 0.001
    stop_max_pct: 0.012          # gold on TN CFD: tighter range than crypto gold

deduplication:
  window_candles: 3              # suppress same pair+dir+strategy+regime within N candles

walk_forward:
  outcome_window_hours: 8        # how long after fire to check outcome
  promotion_gate_total: 38       # minimum total shadow signals for promotion
  promotion_gate_per_regime: 15  # minimum per regime label
  promotion_accuracy: 0.55       # minimum directional accuracy (55% = profitable at 1.5:1 R:R)

llm:
  commentary_model: "claude-haiku-4-5-20251001"
  analysis_model: "claude-sonnet-4-6"
  max_tokens: 256
  cache_ttl_seconds: 300

dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false

copy_trader:
  enabled: true
  top_n: 5
  initial_balance: 10000        # starting capital in USDT
  position_size_pct: 0.05       # allocate 5% of current balance per copied position ($500 at start)
  stop_loss_pct: 0.20           # auto-close copy position if it loses >20% of margin
  max_concurrent_positions: 15  # hard cap across all tracked traders
  min_pnl_30d: 100000           # only follow traders with >$100K 30d PnL
  poll_interval_minutes: 2      # how often to check HL positions (was 15 — top traders open/close in minutes)
  min_position_usdt: 15         # hard floor per trade — below this, skip the open (HL minimum notional ~$10-15)
  reset_balance: false          # set true + restart to reset DB balance to initial_balance (only if no open positions)
  position_timeout_hours: 24    # force-close copy positions open longer than this
  trader_silence_threshold: 3   # consecutive empty-position polls before deactivating a trader
  candidate_score_threshold: 2.0  # composite score floor to enter hl_candidates watchlist
  candidate_promote_cycles: 3   # consecutive daily cycles above threshold → promote to copy_traders
  candidate_drop_cycles: 2      # consecutive daily cycles below threshold → drop from watchlist
  max_candidates: 50            # hard cap on hl_candidates rows in 'watching' status; evict lowest scorer
  min_leaderboard_rows: 10000   # outage guard — skip refresh if raw HL response has fewer rows than this
  arbiscan_api_key: ""          # optional; free tier (5 req/s, 100K/day) works without key. Set via ARBISCAN_API_KEY env var.

paper_trader:
  reset_account: false            # set true + restart to wipe positions and restart from $1,000 USDT
  slip_adjust_sizing: true        # size on effective_risk (sl_dist + entry/exit slip) so actual $ risk = target %
  position_timeout_hours: 48      # close stale positions at market after 2 days

  # ── Kelly Criterion position sizing ───────────────────────────────────────────
  # When enabled, replaces fixed risk_pct with half-Kelly computed from the last
  # 60 days of live resolved signals for each strategy+regime+direction combo.
  # Falls back to risk_pct_default if fewer than 20 resolved trades are available.
  # Half-Kelly is used (not full Kelly) to reduce variance while preserving most
  # of the long-run growth advantage. Hard cap: never exceeds 3% per trade.
  # Enable only after accumulating enough live trade history (≥20 trades per combo).
  kelly_sizing: true
  circuit_breaker_losses: 5       # pause new entries after N consecutive losses
  circuit_breaker_cooldown_hours: 4  # hours to wait before resuming after circuit breaker trips

  # ── Drawdown circuit breakers ─────────────────────────────────────────────────
  # Applied independently to the crypto and indices accounts.
  # daily_half_size_pct: if today's realized loss > 2%, halve new position sizes
  # daily_halt_pct:      if today's realized loss > 3%, halt new entries + close all open
  # weekly_halt_pct:     if this week's realized loss > 5%, halt new entries
  # peak_lockout_pct:    if drawdown from all-time peak > 10%, write a lock file and stop
  #                      the bot — delete logs/paper_trade/LOCKOUT_<acct>.lock to resume
  drawdown:
    daily_half_size_pct: 0.02
    daily_halt_pct:      0.03
    weekly_halt_pct:     0.05
    peak_lockout_pct:    0.10

  # ── Gap-risk cap ──────────────────────────────────────────────────────────────
  # Prevents a single candle gap from exceeding N× the intended risk on that trade.
  # Uses risk_usdt_at_open stored when the position was opened (not live balance).
  max_loss_mult: 3.0              # cap gross loss at 3× the intended risk_usdt

  # ── Per-regime position sizing ────────────────────────────────────────────────
  # risk_pct_default applies when regime is not listed below.
  # high-volatility uses 0.7% to reduce gap exposure (wider candles = bigger gap risk).
  # Trending is kept neutral at 1% for first pass — increase after WR stabilises.
  risk_pct_default: 0.010
  risk_pct_by_regime:
    trending-up:       0.010
    trending-down:     0.010
    choppy:            0.010
    high-volatility:   0.007      # smaller: gap risk higher in high-vol regimes

  # ── Fees ─────────────────────────────────────────────────────────────────────
  # Taker rate used for: entry (market order) + SL/flip/timeout exits (market order)
  # Maker rate used for: TP exits (limit order resting on book)
  taker_fee_pct: 0.0002           # 0.02% — MEXC futures taker (Level 0); verify at mexc.com/fee if your tier differs
  # Per-exchange maker rates (TP exits); 0 = free maker on MEXC futures
  maker_fee_rates:
    mexc:        0.0000            # MEXC futures maker: free
    binance:     0.0002            # 0.02%
    okx:         0.0002            # 0.02%
    hyperliquid: 0.0001            # 0.01%
    tradenation: 0.0000            # TN CFDs: spread-only pricing, no per-trade commission

  # ── CFD overnight financing (Trade Nation indices/gold) ─────────────────────
  # Charged once at 22:00 UTC for each open position (daily cutoff model).
  # Applied per cutoff that has passed since the position was opened.
  # Trade Nation rate is approximately SOFR + 2.5% annual at 20x leverage.
  overnight_finance_rate_annual: 0.05   # 5% annual — verify at tradenation.com/cfds

  # ── Slippage ─────────────────────────────────────────────────────────────────
  # Calibrated 2026-05-18 via slippage_calibration.py (n=15 live trades):
  #   Entry: signal_close → next_candle_open. adverse mean=0.135%, median=0.037%
  #   SL exit: SL price vs candle extreme. mean=0.730%, median=0.414%
  # Using median + 25% safety margin as the calibrated estimate.
  entry_slippage_pct: 0.0005      # 0.05% — raised from 0.02% (observed adverse median 0.037%, mean 0.135%)
  slippage_pct: 0.0052            # 0.52% — raised from 0.05% (observed SL gap median 0.414% + 25% margin)

  # ── Funding ──────────────────────────────────────────────────────────────────
  # Per-pair 8h funding rate; sign: positive = longs pay shorts (normal bull market)
  # Negative rates are valid (bearish: shorts pay longs) — set to reflect current conditions
  funding_rate_8h: 0.0001         # fallback if pair not in funding_rates_8h below
  funding_rates_8h:
    BTC/USDT:USDT:  0.0001        # ~0.01% per 8h — BTC perp historical avg
    ETH/USDT:USDT:  0.0001
    SOL/USDT:USDT:  0.0001
    XAUT/USDT:USDT: 0.00005       # gold perp — lower funding, less speculative demand
    BTC/USDC:USDC:  0.0001
    ETH/USDC:USDC:  0.0001
    SOL/USDC:USDC:  0.0001

polymarket_trader:
  enabled: true
  top_n: 10                    # wider than HL (5) because PM traders specialise by category
  initial_balance: 10000
  position_size_pct: 0.05
  max_concurrent_positions: 20
  min_pnl_30d: 50000
  volume_floor: 10000          # filter single-market outliers
  # Polymarket has no public leaderboard API — add top trader wallet addresses here.
  # Find them at polymarket.com/leaderboard. The service will track their positions.
  watched_wallets: []
  poly_discovery_markets: 20    # top markets by volume to scan for wallet discovery
  poly_min_position_usdt: 1000  # min position value (shares × price) to qualify
  poly_discovery_top_n: 5       # max new wallets to add per weekly discovery run
